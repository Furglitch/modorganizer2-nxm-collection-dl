name: build-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to build'
        required: true
        default: '1.X.X'

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Create package directory
        run: |
          rm -rf nxm-collection-dl
          mkdir -p nxm-collection-dl
          cp __init__.py __meta__.py api.py download.py install.py var.py LICENSE README.md nxm-collection-dl/ || true
          cp -R icons/ nxm-collection-dl/ || true
          test -f cacert.pem && cp cacert.pem nxm-collection-dl/ || true

      - name: Create release archive
        run: |
          zip -r nxm-collection-dl-${{ github.event.inputs.version }}.zip nxm-collection-dl/

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.version }}
          release_name: "${{ github.event.inputs.version }}"
          body: "NXM Collection Downloader v${{ github.event.inputs.version }}"
          draft: false
          prerelease: false

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: nxm-collection-dl-${{ github.event.inputs.version }}.zip
          asset_name: nxm-collection-dl-${{ github.event.inputs.version }}.zip
          asset_content_type: application/zip
